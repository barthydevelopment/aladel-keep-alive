name: Supabase Keep Alive

on:
  schedule:
    # يقوم بتشغيل الأمر كل 3 أيام في الساعة 12 منتصف الليل
    - cron: '0 0 */3 * *'
  workflow_dispatch: # للسماح بتشغيله يدوياً للتجربة

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
